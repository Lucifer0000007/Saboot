# Netlify build settings. HTTP headers (security, CSP, caching) live in public/_headers only, so there is a
# single definition; do not add [[headers]] blocks here.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # The version the project builds and tests on (verify.sh, package.json "engines").
  NODE_VERSION = "24"
