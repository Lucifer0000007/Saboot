<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Saboot — the clock starts at the storm</title>
    <meta name="description" content="Saboot is a prototype of a disaster crop-loss evidence layer. After a flood it starts an evidence clock, alerts the farmer by voice, guides photos that work offline and seals them so any edit shows. The demo uses synthetic data in a fictional district." />
    <meta name="theme-color" content="#f0f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12140f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      // Apply saved per-viewer preferences before first paint (no layout shift). A saved Hindi/Punjabi
      // choice keeps the prerendered English shell hidden until its dictionary and fonts are ready.
      (function () {
        var c = document.documentElement.classList;
        function get(k) { try { return JSON.parse(localStorage.getItem('saboot.' + k)); } catch (e) { return null; } }
        var ts = get('textScale');
        if (ts === 125 || ts === 150) c.add('t' + ts);
        if (get('lowData')) c.add('lowdata', 'still');
        if (get('hc')) c.add('hc');
        var th = get('theme');
        if (th === 'dark' || (th !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)) c.add('theme-dark');
        // no saved choice: the device's language, the same rule as pickLang() in src/lib/prefs.ts
        var l = get('lang');
        if (l === null) {
          var ls = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
          for (var i = 0; i < ls.length; i++) { var p = String(ls[i]).slice(0, 2).toLowerCase(); if (p === 'hi' || p === 'pa' || p === 'en') { l = p; break; } }
        }
        if (l === 'hi' || l === 'pa') { c.add('lang-pending', 'l-' + l); setTimeout(function () { c.remove('lang-pending'); }, 2500); }
      })();
    </script>
    <style>html.lang-pending #app { visibility: hidden; }</style>
    <link rel="preload" href="data/flood-replay.json" as="fetch" crossorigin fetchpriority="low" />
    <!--fonts-->
  </head>
  <body>
    <div id="app"><!--ssr--></div>
    <noscript><p style="padding:16px">Saboot is an interactive prototype and needs JavaScript.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
